name: Validate 3D assets

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  meshcontract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install MeshContract
        run: python -m pip install "git+https://github.com/Ikonido/MeshContract.git@main"

      - name: Check OBJ contract
        run: meshcontract check examples/example.obj --contract examples/.meshcontract.yml
