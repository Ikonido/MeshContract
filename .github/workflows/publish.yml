name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "The first PyPI upload is pinned to v0.2.0"
        type: choice
        options:
          - v0.2.0
        required: true
        default: v0.2.0

permissions:
  contents: read

jobs:
  build:
    name: Build and check distributions
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - name: Check out release source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          persist-credentials: false

      - name: Verify manual v0.2.0 source
        if: github.event_name == 'workflow_dispatch'
        run: |
          test "$(git rev-parse HEAD)" = "57af4fe645d4963d0d0d5952334bd1605f6f376c"
          python -c 'import tomllib; p=tomllib.load(open("pyproject.toml", "rb"))["project"]; assert p["name"] == "meshcontract" and p["version"] == "0.2.0"'

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build and verify distributions
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish to PyPI
    needs: build
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/meshcontract
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
